# nexwe-admin (the NEXWE admin dashboard, nexwe repo apps/admin), production — copy to /etc/algo3/apps/nexwe-admin/production.conf
# A static site served by Caddy; it talks to api.nexwe.app (chosen from its own hostname). No runtime secrets.
IMAGE=ghcr.io/arslan-khan-dev/nexwe-admin
CONTAINER_PORT=80
HEALTH_PATH=/
RELEASE_PATH=/release.json
RELEASE_KEY=release
HOSTNAME=admin.nexwe.app
# Staff only: never indexed (the site sends X-Robots-Tag: noindex too).
NOINDEX=true
NETWORKS=studio
MEM_LIMIT=64m
CPUS=0.25
READ_ONLY=false
# Production only accepts a release (sha AND digest) that was verified live on staging first.
PROMOTE_FROM=staging
