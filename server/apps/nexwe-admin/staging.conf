# nexwe-admin (the NEXWE admin dashboard, nexwe repo apps/admin), staging — copy to /etc/algo3/apps/nexwe-admin/staging.conf
# A static site served by Caddy; it talks to staging-api.nexwe.app (chosen from its own hostname). No runtime secrets.
IMAGE=ghcr.io/arslan-khan-dev/nexwe-admin
CONTAINER_PORT=80
HEALTH_PATH=/
RELEASE_PATH=/release.json
RELEASE_KEY=release
HOSTNAME=staging-admin.nexwe.app
# Never indexed (the site also sends X-Robots-Tag: noindex itself).
NOINDEX=true
NETWORKS=studio
MEM_LIMIT=64m
CPUS=0.25
READ_ONLY=false
