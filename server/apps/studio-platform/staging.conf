# studio-platform, staging — copy to /etc/algo3/apps/studio-platform/staging.conf
#
# A compose STACK, not an app: algo3-deploy hands it to algo3-deploy-stack.
# The release is a bundle image (the repo's files, Dockerfile.bundle); the
# stack's own state (.env, S3 keys, this host's GoTrue blocks, volumes) is
# never shipped or overwritten.
KIND=stack
IMAGE=ghcr.io/arslan-khan-dev/studio-platform
STACK_DIR=/opt/studio-platform-staging
# Per-host files add-product.sh writes. .env is always kept.
PRESERVE=scripts/s3-identities.json,identities.yml,restore
# Idempotent: the database rules, and the stack's sites on the edge (the edge
# reloads only when they changed).
POST_COMMANDS=scripts/harden-db.sh,scripts/edge-sites.sh
WAIT_TIMEOUT=300
