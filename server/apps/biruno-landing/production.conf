# biruno-landing, production — copy to /etc/algo3/apps/biruno-landing/production.conf
#
# The BirunoAI marketing site (Eleventy, served by Caddy in the image). It took
# birunoai.com and www. over from the biruno app; production.caddy.tmpl keeps
# /api/* on both flowing to the biruno API (installed desktop builds have this
# host baked in) and sends the old app pages to app.birunoai.com.
IMAGE=ghcr.io/arslan-khan-dev/biruno-landing
CONTAINER_PORT=80
HEALTH_PATH=/
RELEASE_PATH=/release.json
RELEASE_KEY=release
HOSTNAME=birunoai.com
# Not REDIRECTS: those must be permanent and pass nothing through, and www.
# still carries /api for installed desktop builds. The template redirects the rest.
ALIASES=www.birunoai.com
NETWORKS=studio
MEM_LIMIT=128m
CPUS=0.5
READ_ONLY=false
# Production only accepts a release (sha AND digest) verified on staging first.
PROMOTE_FROM=staging
