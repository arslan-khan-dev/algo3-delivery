# biruno-landing, staging — copy to /etc/algo3/apps/biruno-landing/staging.conf
#
# Takes staging.birunoai.com over from biruno's staging; staging.caddy.tmpl keeps
# /api/* flowing to the biruno staging API, as production does.
IMAGE=ghcr.io/arslan-khan-dev/biruno-landing
CONTAINER_PORT=80
HEALTH_PATH=/
RELEASE_PATH=/release.json
RELEASE_KEY=release
HOSTNAME=staging.birunoai.com
# Staging must never be indexed (the template sets the header itself).
NOINDEX=true
NETWORKS=studio
MEM_LIMIT=128m
CPUS=0.25
READ_ONLY=false
