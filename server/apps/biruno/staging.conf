# biruno, staging — copy to /etc/algo3/apps/biruno/staging.conf
#
# Same image as production. What differs is the environment (in staging.env):
# its own database (biruno_staging), bucket, and GoTrue (auth-biruno-staging),
# so staging can neither read production's data nor accept its tokens.
IMAGE=ghcr.io/arslan-khan-dev/biruno-ai
CONTAINER_PORT=8100
HEALTH_PATH=/api/health
RELEASE_PATH=/api/health
RELEASE_KEY=version
RELEASE_COMMAND=node dist/migrate.js
# The web app; the API and the old domains are ALIASES with their own routing
# in staging.caddy.tmpl. Not REDIRECTS: those must be permanent and pass nothing
# through, and the old domain still carries /api for installed desktop builds.
HOSTNAME=staging-app.birunoai.com
ALIASES=staging-api.birunoai.com,staging.birunoai.com
# Checked on every domain after a switch: the API must answer through each.
PUBLIC_PATH=/api/health
# The STAGING platform (studio-platform-staging): its postgres, seaweedfs,
# ai and gotrue answer by the same names production's do on `studio`.
NETWORKS=studio-staging
MEM_LIMIT=384m
CPUS=0.25
READ_ONLY=true
TMPFS=/tmp
