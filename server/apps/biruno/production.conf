# biruno, production — copy to /etc/algo3/apps/biruno/production.conf
#
# BIRUNO_DOMAIN is a placeholder until the domain is chosen: the deployer
# refuses it as an invalid HOSTNAME, so nothing can be installed by mistake.
#
# One image: the Fastify API, which also serves the built web app.
IMAGE=ghcr.io/zainzahid/biruno-ai
CONTAINER_PORT=8100
# 200 only when the database is reachable AND every migration in the image is
# applied; it also reports the release it was built from.
HEALTH_PATH=/api/health
RELEASE_PATH=/api/health
RELEASE_KEY=version
# Runs once from the new image, before it takes traffic (forward-only SQL
# migrations, recorded in schema_migrations). Must be expand -> contract: the
# previous release keeps serving while it runs, and a rollback runs older code
# on the newer schema.
RELEASE_COMMAND=node dist/migrate.js
HOSTNAME=BIRUNO_DOMAIN
NETWORKS=studio
# Measured: ~64 MB idle, 146 MB peak.
MEM_LIMIT=384m
CPUS=0.5
READ_ONLY=true
TMPFS=/tmp
# Production only accepts a release (sha AND digest) verified on staging first.
PROMOTE_FROM=staging
