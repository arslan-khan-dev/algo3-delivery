# nexwe-website, staging — copy to /etc/algo3/apps/nexwe-website/staging.conf
IMAGE=ghcr.io/arslan-khan-dev/nexwe-website
CONTAINER_PORT=80
HEALTH_PATH=/
RELEASE_PATH=/release.json
RELEASE_KEY=release
HOSTNAME=staging.nexwe.app
# Staging must never be indexed by search engines.
NOINDEX=true
NETWORKS=studio
MEM_LIMIT=128m
CPUS=0.25
READ_ONLY=false
