# nexwe-website, production — copy to /etc/algo3/apps/nexwe-website/production.conf
IMAGE=ghcr.io/arslan-khan-dev/nexwe-website
CONTAINER_PORT=80
HEALTH_PATH=/
RELEASE_PATH=/release.json
RELEASE_KEY=release
HOSTNAME=nexwe.app
NETWORKS=studio
MEM_LIMIT=128m
CPUS=0.5
READ_ONLY=false
# Production only accepts a release (sha AND digest) that was verified live on
# staging first. This is checked here on the server, independently of CI.
PROMOTE_FROM=staging
