# nexwe (the NEXWE API), staging — copy to /etc/algo3/apps/nexwe/staging.conf
#
# Same image as production; its own database (nexwe_staging), bucket and JWT
# secret in staging.env, so a staging token is meaningless to production.
IMAGE=ghcr.io/arslan-khan-dev/nexwe-api
CONTAINER_PORT=4000
HEALTH_PATH=/health
RELEASE_PATH=/health
RELEASE_KEY=version
# The public check needs a 2xx: an API has no page at /.
PUBLIC_PATH=/health
RELEASE_COMMAND=npx prisma migrate deploy
OVERLAP=false
HOSTNAME=staging-api.nexwe.app
NOINDEX=true
NETWORKS=studio
MEM_LIMIT=512m
CPUS=0.5
READ_ONLY=false
