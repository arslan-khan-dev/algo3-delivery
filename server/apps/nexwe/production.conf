# nexwe (the NEXWE API: Express + Socket.IO), production —
# copy to /etc/algo3/apps/nexwe/production.conf
IMAGE=ghcr.io/arslan-khan-dev/nexwe-api
CONTAINER_PORT=4000
HEALTH_PATH=/health
RELEASE_PATH=/health
RELEASE_KEY=version
# The public check needs a 2xx: an API has no page at /.
PUBLIC_PATH=/health
# Runs once from the new image, before the switch. Every migration must be
# expand -> contract: a rollback runs the previous code on the migrated schema.
RELEASE_COMMAND=npx prisma migrate deploy
# ONE copy at a time. Live games, calls and chat presence live in this process's
# memory, and its timers (FutureLock tick, account jobs) must never run twice.
# The old release stops BEFORE the new one starts: a deploy costs a few seconds
# and drops live sockets, which the app reconnects. Deploy at quiet times.
OVERLAP=false
HOSTNAME=api.nexwe.app
# Its database (nexwe) and bucket (nexwe-media) are on the platform, reached
# over the studio network. Secrets in production.env (root, 0600).
NETWORKS=studio
MEM_LIMIT=512m
CPUS=1
# Writable: game-clip MP4 exports use /tmp, and a tmpfs would count against
# the memory limit.
READ_ONLY=false
PROMOTE_FROM=staging
