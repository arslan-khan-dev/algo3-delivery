# Sourced by Netdata AFTER its stock file, so only overrides belong here.
# shellcheck shell=bash
# shellcheck disable=SC2034,SC2154 # alarm-notify.sh reads these settings, and supplies name/status/host/…
#
# Alerts reach you by EMAIL, through healthchecks.io. Netdata pings the
# "server-alerts" check: /fail while any alert is active, a plain ping once
# everything has cleared. healthchecks.io then emails "DOWN" (with the details
# below) and "UP". No mail server or mail password lives on this machine.
#
# The ping URL comes from /opt/algo3/ops/.env (ALGO3_ALERTS_CHECK_URL), never
# from git: anyone holding it could send fake alerts or silence real ones.

SEND_EMAIL="NO"
SEND_TELEGRAM="NO"
SEND_CUSTOM="YES"
DEFAULT_RECIPIENT_CUSTOM="healthchecks"

# Called by Netdata's alarm-notify.sh for every alert transition. It provides
# the alert in variables: status (WARNING, CRITICAL, CLEAR, REMOVED…), name,
# host, value_string, info, and the totals of alerts still active
# (total_warnings, total_critical, with their names in total_warn_alarms and
# total_crit_alarms).
custom_sender() {
  local url="${ALGO3_ALERTS_CHECK_URL}" target verdict=down body cacert=()

  if [ -z "${url}" ]; then
    info "ALGO3_ALERTS_CHECK_URL is empty; not sending ${name} ${status}"
    return 1
  fi
  if ! [[ "${url}" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._/-]*)?$ ]]; then
    error "ALGO3_ALERTS_CHECK_URL is not a plain https URL; not sending ${name} ${status}"
    return 1
  fi

  # One check, one status: report "down" while ANY alert is active, so that one
  # alert clearing never announces "all good" while another is still on.
  target="${url}/fail"
  if [ "${status}" != "WARNING" ] && [ "${status}" != "CRITICAL" ] &&
     [ "${total_warnings:-0}" = "0" ] && [ "${total_critical:-0}" = "0" ]; then
    target="${url}"; verdict=up
  fi

  # The first line is what you see first in the email.
  body="$(printf '%s %s on %s\n\nValue: %s\nWhat it means: %s\nStill active: %s critical (%s), %s warning (%s)\nDashboard: ssh -L 19999:127.0.0.1:19999 algo3@<server>, then http://localhost:19999\n' \
    "${status}" "${name}" "${host}" "${value_string:-n/a}" "${info:-n/a}" \
    "${total_critical:-0}" "${total_crit_alarms:-none}" "${total_warnings:-0}" "${total_warn_alarms:-none}")"

  # Trust the host's CA list (kept current by Ubuntu's updates), mounted at
  # /host/root, rather than only the one baked into this image.
  [ -f /host/root/etc/ssl/certs/ca-certificates.crt ] &&
    cacert=(--cacert /host/root/etc/ssl/certs/ca-certificates.crt)

  if curl --fail --silent --show-error --max-time 10 --retry 3 "${cacert[@]}" \
       --data-raw "${body}" "${target}" >/dev/null; then
    info "sent ${status} ${name} to healthchecks.io (${verdict})"
    return 0
  fi
  error "could not send ${status} ${name} to healthchecks.io"
  return 1
}
