# Sourced by Netdata AFTER its stock file, so only overrides belong here.
# The token and chat id come from /opt/algo3/ops/.env, never from git.
SEND_TELEGRAM="YES"
TELEGRAM_BOT_TOKEN="${ALGO3_TELEGRAM_BOT_TOKEN}"
DEFAULT_RECIPIENT_TELEGRAM="${ALGO3_TELEGRAM_CHAT_ID}"

# Email needs a mail server inside this container; off-box email alerts come
# from healthchecks.io and UptimeRobot instead.
SEND_EMAIL="NO"
