# TLS certificates to watch. Netdata's stock alert warns below 14 days to
# expiry and goes critical below 7. Caddy renews at ~30 days left, so an
# alert here means renewal is failing.
jobs:
  - name: nexwe_app
    source: https://nexwe.app:443
  - name: staging_nexwe_app
    source: https://staging.nexwe.app:443
