# Replaces Netdata's stock health.d/docker.conf (same file name).
#
# The stock file also alerts on ANY stopped container (docker_container_down).
# On this server stopped containers are the retained rollback releases, kept
# on purpose, so that alert would fire permanently and train everyone to
# ignore alerts. What actually signals trouble is kept:

# A running container whose healthcheck fails. autoheal restarts it; this
# tells a person it happened.
 template: docker_container_unhealthy
       on: docker.container_health_status
    class: Errors
     type: Containers
component: Docker
    units: status
    every: 10s
   lookup: average -10s of unhealthy
     warn: $this > 0
    delay: down 1m multiplier 1.5 max 2h
  summary: Docker container ${label:container_name} health
     info: ${label:container_name} docker container health status is unhealthy
       to: sysadmin

# A container stuck restarting (crash loop): the restart policy keeps trying,
# which hides the failure unless something says so.
 template: docker_container_restarting
       on: docker.container_state
    class: Errors
     type: Containers
component: Docker
    units: status
    every: 10s
   lookup: average -1m of restarting
     warn: $this > 0
    delay: down 1m multiplier 1.5 max 2h
  summary: Docker container ${label:container_name} restarting
     info: ${label:container_name} has been restarting for the last minute (crash loop)
       to: sysadmin
