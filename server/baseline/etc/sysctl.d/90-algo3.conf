# algo3 server baseline.
#
# A kernel panic reboots the machine after 10 seconds instead of hanging it
# forever. Docker starts at boot and every container has a restart policy, so
# a reboot brings the products back on its own; the box heartbeat alerts if it
# does not.
kernel.panic = 10

# Prefer keeping applications in RAM; the 2 GiB swap file is a safety net for
# a memory spike, not working space. (Ubuntu's default is 60.)
vm.swappiness = 10
