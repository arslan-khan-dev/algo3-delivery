# algo3 SSH policy. Installed LAST in the baseline, only after key login for
# algo3 has been proven in a second session.
#
# sshd uses the FIRST value it reads for each setting, and reads drop-ins in
# name order, so "10-" wins over cloud-init's "50-cloud-init.conf" (which is
# what turns PasswordAuthentication on today).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
MaxAuthTries 3

# algo3-deploy is the CI account: every key it has is pinned to a forced
# command (algo3-deploy-ssh), so allowing it here grants no shell.
# zain: kept as-is by decision (2026-10-28); revisit.
AllowUsers zain algo3 algo3-deploy
