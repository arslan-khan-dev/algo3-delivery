# algo3-turn — coturn, the TURN relay that lets nexwe's calls connect through
# strict NATs and firewalls. One server for both environments.
#
#   sudo install -d -m 0700 /opt/algo3/turn
#   sudo cp turn/compose.yml /opt/algo3/turn/
#   sudo cp turn/turnserver.conf.example /opt/algo3/turn/turnserver.conf   # then fill in the secret
#   sudo docker compose -p algo3-turn -f /opt/algo3/turn/compose.yml up -d
#
# NOT blue/green: it holds no release, changes rarely, and a restart only makes
# calls that are being set up retry. Upgrade in a quiet hour.
#
# Host networking, because TURN hands each call a relay port from a range, and
# publishing thousands of ports through Docker's proxy is slow and fragile. With
# host networking ufw applies normally (unlike published Docker ports), so the
# ports must be opened explicitly:
#   sudo ufw allow 3478/tcp && sudo ufw allow 3478/udp && sudo ufw allow 49160:49400/udp
# and the same three in the Hostinger panel's VPS firewall, if it is on. Without them calls
# connect but nobody hears anything whenever the phones can't reach each other directly (most
# mobile networks). Check from any other computer; it must say open:
#   timeout 5 bash -c 'cat </dev/null >/dev/tcp/turn.nexwe.app/3478' && echo open
name: algo3-turn

services:
  coturn:
    image: coturn/coturn:4.7.0@sha256:a00afb5b4890de4df22bbe70379c6b316685dffee297d53cac1271dcb91fab93
    container_name: algo3-turn
    restart: unless-stopped
    network_mode: host
    mem_limit: 128m
    # The secret lives in the config file, never on the command line (where
    # `ps` and `docker inspect` would show it). The file is world-readable for
    # the container's `nobody` user; its folder /opt/algo3/turn is root-only
    # (0700), so no other account on the server can reach it.
    command: ['-c', '/etc/coturn/turnserver.conf']
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
